# 推到 main 就 build 並部署到 Cloudflare（Workers static assets，設定在 wrangler.jsonc）。
# 要先在 GitHub 設定：
#   secrets.CLOUDFLARE_API_TOKEN   Cloudflare API token（用「Edit Cloudflare Workers」範本就夠）
#   vars.CLOUDFLARE_ACCOUNT_ID     帳號 ID（已設）
#   vars.VITE_SUPABASE_URL / vars.VITE_SUPABASE_ANON_KEY / vars.VITE_VAPID_PUBLIC_KEY（都是公開值，前兩個已設）
#   vars.CLOUDFLARE_DEPLOY = true  開關：token 設好之後才打開，不然每次推送都會紅一個失敗
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本讀 package.json 的 packageManager

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
